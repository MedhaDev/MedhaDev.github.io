<svg width="500" height="320" viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Three speech bubbles representing interviews, hand-drawn style -->
  <g stroke="#1a1919" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40,50 Q38,48 42,46 Q90,38 130,48 Q136,50 134,58 L132,88 Q130,96 122,94 Q80,102 46,92 Q38,90 40,82 Z" />
    <path d="M55,94 L48,112 L68,96" />
    <line x1="55" y1="60" x2="115" y2="58" />
    <line x1="55" y1="70" x2="105" y2="69" />
    <line x1="55" y1="80" x2="95" y2="79" />
  </g>

  <g stroke="#1a1919" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40,140 Q38,138 42,136 Q90,128 130,138 Q136,140 134,148 L132,178 Q130,186 122,184 Q80,192 46,182 Q38,180 40,172 Z" />
    <path d="M55,184 L48,202 L68,186" />
    <line x1="55" y1="150" x2="115" y2="148" />
    <line x1="55" y1="160" x2="105" y2="159" />
    <line x1="55" y1="170" x2="95" y2="169" />
  </g>

  <g stroke="#1a1919" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40,230 Q38,228 42,226 Q90,218 130,228 Q136,230 134,238 L132,268 Q130,276 122,274 Q80,282 46,272 Q38,270 40,262 Z" />
    <path d="M55,274 L48,292 L68,276" />
    <line x1="55" y1="240" x2="115" y2="238" />
    <line x1="55" y1="250" x2="105" y2="249" />
    <line x1="55" y1="260" x2="95" y2="259" />
  </g>

  <text x="47" y="27" font-family="'Courier New', monospace" font-size="13" fill="#1a1919" font-weight="bold">15 interviews</text>

  <!-- Green flowing arrow from interviews to coding -->
  <path d="M150,160 Q200,90 250,160" stroke="#5a8a5a" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5a8a5a"/>
    </marker>
  </defs>

  <text x="165" y="100" font-family="'Courier New', monospace" font-size="13" fill="#3a6b3a" font-weight="bold" text-decoration="underline">CODING</text>

  <!-- Three theme boxes, hand-drawn -->
  <g stroke="#1a1919" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280,60 L390,58 Q396,58 396,64 L397,110 Q397,116 391,116 L282,118 Q276,118 276,112 L276,66 Q276,60 280,60 Z" />
  </g>
  <text x="288" y="82" font-family="'Courier New', monospace" font-size="12" fill="#2a5a9a" font-weight="bold">COMPONENTS</text>
  <line x1="288" y1="94" x2="380" y2="93" stroke="#1a1919" stroke-width="1.5"/>
  <line x1="288" y1="103" x2="360" y2="102" stroke="#1a1919" stroke-width="1.5"/>

  <g stroke="#1a1919" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280,140 L390,138 Q396,138 396,144 L397,190 Q397,196 391,196 L282,198 Q276,198 276,192 L276,146 Q276,140 280,140 Z" />
  </g>
  <text x="288" y="162" font-family="'Courier New', monospace" font-size="12" fill="#2a5a9a" font-weight="bold">CHALLENGES</text>
  <line x1="288" y1="174" x2="380" y2="173" stroke="#1a1919" stroke-width="1.5"/>
  <line x1="288" y1="183" x2="360" y2="182" stroke="#1a1919" stroke-width="1.5"/>

  <g stroke="#1a1919" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280,220 L390,218 Q396,218 396,224 L397,270 Q397,276 391,276 L282,278 Q276,278 276,272 L276,226 Q276,220 280,220 Z" />
  </g>
  <text x="288" y="242" font-family="'Courier New', monospace" font-size="12" fill="#2a5a9a" font-weight="bold">STIGMA</text>
  <line x1="288" y1="254" x2="380" y2="253" stroke="#1a1919" stroke-width="1.5"/>
  <line x1="288" y1="263" x2="360" y2="262" stroke="#1a1919" stroke-width="1.5"/>

  <!-- connecting lines from coding to each theme box -->
  <path d="M255,150 Q265,120 280,90" stroke="#1a1919" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <path d="M255,165 L276,168" stroke="#1a1919" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <path d="M255,180 Q265,220 280,248" stroke="#1a1919" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>

  <text x="290" y="305" font-family="'Courier New', monospace" font-size="13" fill="#1a1919" font-weight="bold">THEMES</text>
</svg>
